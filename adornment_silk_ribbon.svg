<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <!-- Red silk gradient -->
    <linearGradient id="silk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#721212" />
      <stop offset="30%" stop-color="#A32020" />
      <stop offset="50%" stop-color="#CC2929" />
      <stop offset="70%" stop-color="#A32020" />
      <stop offset="100%" stop-color="#721212" />
    </linearGradient>
    <!-- Gold thread gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F4D381" />
    </linearGradient>
  </defs>
  <!-- Two hanging gold threads -->
  <line x1="120" y1="0" x2="120" y2="90" stroke="url(#gold)" stroke-width="2"/>
  <line x1="280" y1="0" x2="280" y2="90" stroke="url(#gold)" stroke-width="2"/>
  <!-- Small attachment circles at top of ribbon -->
  <circle cx="120" cy="90" r="3" fill="#D4AF37"/>
  <circle cx="280" cy="90" r="3" fill="#D4AF37"/>
  
  <!-- The Ribbon body -->
  <path d="M 60 90 L 340 90 A 8 8 0 0 1 348 98 L 348 200 A 8 8 0 0 1 340 208 L 60 208 A 8 8 0 0 1 52 200 L 52 98 A 8 8 0 0 1 60 90 Z" fill="url(#silk)" filter="drop-shadow(0px 10px 15px rgba(0,0,0,0.3))"/>
  
  <!-- Inner Gold Stitching/Thread Frame -->
  <path d="M 64 94 L 336 94 A 4 4 0 0 1 340 98 L 340 196 A 4 4 0 0 1 336 200 L 64 200 A 4 4 0 0 1 60 196 L 60 98 A 4 4 0 0 1 64 94 Z" fill="none" stroke="#E2A727" stroke-width="1.5"/>
  
  <!-- Text inside -->
  <text x="200" y="145" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#FFFFFF" letter-spacing="3" text-anchor="middle">PRÓXIMAMENTE</text>
  <text x="200" y="170" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#FFFFFF" letter-spacing="3" text-anchor="middle">APERTURA !</text>
</svg>

name: Deploy to Netlify (Free CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-netlify
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build site (sitemap, CSS & JS minification)
        run: |
          npm run build

      - name: Diagnose Netlify API
        env:
          RAW_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          RAW_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          CLEAN_TOKEN=$(echo "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_SITE_ID=$(echo "$RAW_SITE_ID" | tr -d '[:space:]')

          echo "=== USER INFO ===" > deploy-result.txt
          curl -s -i -H "Authorization: Bearer $CLEAN_TOKEN" https://api.netlify.com/api/v1/user >> deploy-result.txt

          echo -e "\n=== SITE INFO ===" >> deploy-result.txt
          curl -s -i -H "Authorization: Bearer $CLEAN_TOKEN" "https://api.netlify.com/api/v1/sites/$CLEAN_SITE_ID" >> deploy-result.txt

      - name: Commit deploy log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy-result.txt
          git commit -m "chore: diagnostico de api netlify [skip ci]" || true
          git push origin main || true

name: Deploy to Netlify (Free CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-netlify
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build site (sitemap, CSS & JS minification)
        run: |
          npm run build
          cp styles.min.css BasKula-herramienta/sitio/public/styles.min.css || true
          cp styles.css BasKula-herramienta/sitio/public/styles.css || true
          cp index.html BasKula-herramienta/sitio/public/index.html || true
          cp sitemap.xml BasKula-herramienta/sitio/public/sitemap.xml || true

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx netlify-cli deploy --prod --dir=. --site="${{ secrets.NETLIFY_SITE_ID }}" --auth="${{ secrets.NETLIFY_AUTH_TOKEN }}" --message="Deploy via GitHub Actions (${{ github.sha }})"

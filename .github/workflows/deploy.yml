name: Deploy to Netlify (Free CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-netlify
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build site (sitemap, CSS & JS minification)
        run: |
          npm run build
          cp styles.min.css BasKula-herramienta/sitio/public/styles.min.css || true
          cp styles.css BasKula-herramienta/sitio/public/styles.css || true
          cp index.html BasKula-herramienta/sitio/public/index.html || true
          cp sitemap.xml BasKula-herramienta/sitio/public/sitemap.xml || true

      - name: Deploy to Netlify via Netlify CLI
        env:
          RAW_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          RAW_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          CLEAN_TOKEN=$(echo "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_SITE_ID=$(echo "$RAW_SITE_ID" | tr -d '[:space:]')

          echo "Iniciando despliegue en Netlify..."
          npx --yes netlify-cli deploy --prod --dir=. --site="$CLEAN_SITE_ID" --auth="$CLEAN_TOKEN" > deploy-result.txt 2>&1 || true

      - name: Commit deploy log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy-result.txt
          git commit -m "chore: actualizar log de despliegue [skip ci]" || true
          git push origin main || true

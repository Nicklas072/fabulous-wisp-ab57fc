name: Deploy to Netlify (Free CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-netlify
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build site (sitemap, CSS & JS minification)
        run: |
          npm run build
          cp styles.min.css BasKula-herramienta/sitio/public/styles.min.css || true
          cp styles.css BasKula-herramienta/sitio/public/styles.css || true
          cp index.html BasKula-herramienta/sitio/public/index.html || true
          cp sitemap.xml BasKula-herramienta/sitio/public/sitemap.xml || true

      - name: Deploy to Netlify via Netlify CLI
        env:
          RAW_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          RAW_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          CLEAN_TOKEN=$(echo "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_SITE_ID=$(echo "$RAW_SITE_ID" | tr -d '[:space:]')

          echo "Consultando información del sitio en Netlify..."
          curl -s -H "Authorization: Bearer $CLEAN_TOKEN" "https://api.netlify.com/api/v1/sites/$CLEAN_SITE_ID" > site_info.json
          SITE_NAME=$(jq -r '.name // empty' site_info.json)
          SITE_URL=$(jq -r '.url // empty' site_info.json)
          CUSTOM_DOMAIN=$(jq -r '.custom_domain // empty' site_info.json)
          echo "Sitio Netlify detectado: $SITE_NAME ($SITE_URL) | Dominio: $CUSTOM_DOMAIN"

          echo "Iniciando despliegue de archivos en producción..."
          npx --yes netlify-cli deploy --prod --dir=. --site="$CLEAN_SITE_ID" --auth="$CLEAN_TOKEN" --message="GitHub Actions Deploy (${{ github.sha }})"

          echo "## Despliegue Exitoso en Netlify" >> $GITHUB_STEP_SUMMARY
          echo "- **Sitio:** $SITE_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **URL Netlify:** $SITE_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Dominio Personalizado:** $CUSTOM_DOMAIN" >> $GITHUB_STEP_SUMMARY

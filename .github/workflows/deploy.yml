name: Deploy to Netlify (Free CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-netlify
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Test Netlify Deploy API
        env:
          RAW_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          RAW_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          CLEAN_TOKEN=$(echo "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_SITE_ID=$(echo "$RAW_SITE_ID" | tr -d '[:space:]')

          echo "=== TEST POST DEPLOYS ===" > deploy-result.txt
          curl -s -i -X POST -H "Authorization: Bearer $CLEAN_TOKEN" -H "Content-Type: application/json" -d '{"files": {}}' "https://api.netlify.com/api/v1/sites/$CLEAN_SITE_ID/deploys" >> deploy-result.txt

      - name: Commit deploy log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy-result.txt
          git commit -m "chore: test post deploys [skip ci]" || true
          git push origin main || true

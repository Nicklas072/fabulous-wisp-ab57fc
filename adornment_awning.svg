<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="600" height="100">
  <!-- 12 stripes of 50px width each -->
  <!-- Alternate fill: #222222 (dark charcoal) and #FAF8F5 (cream) -->
  <rect x="0" y="0" width="50" height="75" fill="#222222"/>
  <path d="M 0 75 A 25 25 0 0 0 50 75 Z" fill="#222222"/>
  
  <rect x="50" y="0" width="50" height="75" fill="#FAF8F5"/>
  <path d="M 50 75 A 25 25 0 0 0 100 75 Z" fill="#FAF8F5"/>
  
  <rect x="100" y="0" width="50" height="75" fill="#222222"/>
  <path d="M 100 75 A 25 25 0 0 0 150 75 Z" fill="#222222"/>
  
  <rect x="150" y="0" width="50" height="75" fill="#FAF8F5"/>
  <path d="M 150 75 A 25 25 0 0 0 200 75 Z" fill="#FAF8F5"/>
  
  <rect x="200" y="0" width="50" height="75" fill="#222222"/>
  <path d="M 200 75 A 25 25 0 0 0 250 75 Z" fill="#222222"/>
  
  <rect x="250" y="0" width="50" height="75" fill="#FAF8F5"/>
  <path d="M 250 75 A 25 25 0 0 0 300 75 Z" fill="#FAF8F5"/>
  
  <rect x="300" y="0" width="50" height="75" fill="#222222"/>
  <path d="M 300 75 A 25 25 0 0 0 350 75 Z" fill="#222222"/>
  
  <rect x="350" y="0" width="50" height="75" fill="#FAF8F5"/>
  <path d="M 350 75 A 25 25 0 0 0 400 75 Z" fill="#FAF8F5"/>
  
  <rect x="400" y="0" width="50" height="75" fill="#222222"/>
  <path d="M 400 75 A 25 25 0 0 0 450 75 Z" fill="#222222"/>
  
  <rect x="450" y="0" width="50" height="75" fill="#FAF8F5"/>
  <path d="M 450 75 A 25 25 0 0 0 500 75 Z" fill="#FAF8F5"/>
  
  <rect x="500" y="0" width="50" height="75" fill="#222222"/>
  <path d="M 500 75 A 25 25 0 0 0 550 75 Z" fill="#222222"/>
  
  <rect x="550" y="0" width="50" height="75" fill="#FAF8F5"/>
  <path d="M 550 75 A 25 25 0 0 0 600 75 Z" fill="#FAF8F5"/>
</svg>
